<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alireza Sezar — Verified Engineering Portfolio</title>
  <meta name="description" content="Verified technical portfolio of Alireza Sezar. Built with evidence-backed code and verified engineering principles.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --surface-card: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --font-en: 'Inter', sans-serif;
      --font-fa: 'Vazirmatn', sans-serif;
    }
    html.dark {
      --bg: #090a0f;
      --surface: #0f1118;
      --surface-card: #131722;
      --border: #1e2538;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-en);
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    [dir="rtl"] body { font-family: var(--font-fa); }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
      background: rgba(15, 17, 24, 0.8);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
    }
    .header-inner { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 700; font-size: 1.15rem; letter-spacing: -0.02em; color: var(--text-main); }
    .header-actions { display: flex; gap: 12px; align-items: center; }
    button.btn-ctrl {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button.btn-ctrl:hover { border-color: var(--accent); color: var(--accent); }
    
    /* Hero */
    .hero { padding: 80px 0 50px; text-align: center; }
    .hero h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 12px; }
    .hero p.lead { font-size: 1.25rem; color: var(--text-muted); max-width: 720px; margin: 0 auto 28px; }
    .hero-meta { display: flex; justify-content: center; gap: 16px; font-size: 0.9rem; color: var(--text-muted); }
    
    /* Filters */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 16px;
      margin: 40px 0 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      width: 280px;
    }
    .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-tab {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .filter-tab.active {
      background: var(--accent);
      color: #000000;
      font-weight: 600;
      border-color: var(--accent);
    }
    
    /* Project Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-bottom: 80px; }
    .card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px; display: flex; gap: 8px; }
    .card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
    .card-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px; flex-grow: 1; }
    .card-tech { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 20px; font-family: 'Fira Code', monospace; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 14px; }
    .card-links a { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-inline-end: 12px; }
    .card-links a:hover { text-decoration: underline; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--surface-card); border: 1px solid var(--border); border-radius: 12px;
      max-width: 650px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 32px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .close-btn { background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }
    
    footer { border-top: 1px solid var(--border); padding: 40px 0; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="logo">Alireza Sezar</div>
      <div class="header-actions">
        <button class="btn-ctrl" onclick="toggleLanguage()" id="langBtn">فارسی</button>
        <button class="btn-ctrl" onclick="toggleTheme()" id="themeBtn">◐ Theme</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 id="heroTitle">Alireza Sezar</h1>
      <p class="lead" id="heroBio">Building verifiable, high-performance distributed systems, edge workers, and accessible interfaces.</p>
      <div class="hero-meta">
        <span id="heroRole">Senior Software Engineer & Architect</span>
        <span>·</span>
        <span>2 Verified Projects</span>
        <span>·</span>
        <span>GitHub Pages Ready</span>
      </div>
    </section>

    <div class="controls-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search verified projects..." oninput="filterProjects()">
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setCategory('all', this)">All</button>
        <button class="filter-tab" onclick="setCategory('web_app', this)">Web Apps</button>
        <button class="filter-tab" onclick="setCategory('backend', this)">Backend / Edge</button>
        <button class="filter-tab" onclick="setCategory('dev_tool', this)">Dev Tools</button>
      </div>
    </div>

    <div class="grid" id="projectGrid"></div>
  </main>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modalTitle" style="font-size: 1.4rem;"></h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p>© 2026 Alireza Sezar. Built with verified engineering evidence.</p>
      <p style="margin-top: 8px;">
        <a href="mailto:alirezassezar.1@gmail.com" style="color: var(--accent); margin-inline-end: 16px;">Contact</a>
        <a href="https://github.com/developer" target="_blank" style="color: var(--accent);">GitHub Profile</a>
      </p>
    </div>
  </footer>

  <script>
    const projects = [{"id":"proj_sample_02","nameEn":"Vazir Design System","nameFa":"سیستم دیزاین وزیر","purposeEn":"Accessible, bidirectional (RTL/LTR) component library engineered with Tailwind CSS and React.","purposeFa":"کتابخانه کامپوننت‌های دسترس‌پذیر دوجهته (راست‌به‌چپ و چپ‌به‌راست) با ری‌اکت و تیل‌ویند.","projectType":"dev_tool","status":"working","liveDemoUrl":"https://vazir-design.pages.dev","sourceRepoUrl":"https://github.com/developer/vazir-design-system","hostingProvider":"Cloudflare Pages","myRole":"Sole Creator","techStack":[{"name":"React 19","role":"Core UI component lifecycle and composition primitives."},{"name":"Tailwind CSS","role":"Utility-first bidirectional token system with logical properties (ps/pe)."}],"features":["Automatic direction flip via dir=\"rtl\" context","WCAG 2.1 AA accessible color combinations","Interactive component playground with code copy","Zero external runtime CSS payload"],"aiAssisted":false},{"id":"proj_sample_01","nameEn":"Hyperion Edge Gateway","nameFa":"دروازه لبه هایپریون","purposeEn":"Lightweight, zero-cold-start API routing and rate-limiting proxy deployed on Cloudflare Workers.","purposeFa":"پروکسی سبک مسیریابی و محدودسازی درخواست‌های ای‌پی‌آی بدون تاخیر استارت روی ورکرز کلودفلر.","projectType":"backend","status":"working","liveDemoUrl":"https://hyperion-gateway.workers.dev/health","sourceRepoUrl":"https://github.com/developer/hyperion-edge-gateway","hostingProvider":"Cloudflare Workers","myRole":"Lead Architect","techStack":[{"name":"Cloudflare Workers","role":"Serverless runtime executing edge request pipelines and token verification."},{"name":"TypeScript","role":"Strict type safety across routing controllers and payload schemas."},{"name":"Hono","role":"Ultrafast edge web framework managing route handlers and middleware."}],"features":["Sub-15ms edge request filtering","Token-bucket rate limiter with Cloudflare KV fallback","Dynamic CORS header injection with domain whitelisting","Health probe and JSON error formatting"],"aiAssisted":true}];
    let currentLang = "en";
    let currentCategory = "all";

    const bioEn = "Building verifiable, high-performance distributed systems, edge workers, and accessible interfaces.";
    const bioFa = "توسعه سیستم‌های توزیع‌شده با کارایی بالا، پردازش لبه، و رابط‌های کاربری دسترس‌پذیر.";
    const titleEn = "Senior Software Engineer & Architect";
    const titleFa = "مهندس ارشد نرم‌افزار و معمار سیستم";

    function renderProjects() {
      const grid = document.getElementById('projectGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = projects.filter(p => {
        const matchesCategory = currentCategory === 'all' || p.projectType === currentCategory;
        const name = (currentLang === 'fa' ? p.nameFa : p.nameEn).toLowerCase();
        const desc = (currentLang === 'fa' ? p.purposeFa : p.purposeEn).toLowerCase();
        const tech = p.techStack.map(t => t.name.toLowerCase()).join(' ');
        const matchesSearch = !search || name.includes(search) || desc.includes(search) || tech.includes(search);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">No projects found matching the criteria.</div>';
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const name = currentLang === 'fa' ? p.nameFa : p.nameEn;
        const desc = currentLang === 'fa' ? p.purposeFa : p.purposeEn;
        const techNames = p.techStack.map(t => t.name).join(' · ');

        return `
          <div class="card">
            <div>
              <div class="card-meta">
                <span>${p.hostingProvider}</span>
                <span>·</span>
                <span>${p.myRole}</span>
              </div>
              <h3 class="card-title">${name}</h3>
              <p class="card-desc">${desc}</p>
              <div class="card-tech">${techNames || 'Verified Stack'}</div>
            </div>
            <div class="card-footer">
              <div class="card-links">
                ${p.liveDemoUrl ? `<a href="${p.liveDemoUrl}" target="_blank">Live Demo ↗</a>` : ''}
                ${p.sourceRepoUrl ? `<a href="${p.sourceRepoUrl}" target="_blank">Repository ↗</a>` : ''}
              </div>
              <button class="btn-ctrl" onclick="openModal('${p.id}')">Details</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProjects();
    }

    function filterProjects() {
      renderProjects();
    }

    function toggleTheme() {
      const html = document.documentElement;
      html.classList.toggle('dark');
    }

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'fa' : 'en';
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
      document.getElementById('langBtn').innerText = currentLang === 'fa' ? 'English' : 'فارسی';
      document.getElementById('heroBio').innerText = currentLang === 'fa' ? bioFa : bioEn;
      document.getElementById('heroRole').innerText = currentLang === 'fa' ? titleFa : titleEn;
      renderProjects();
    }

    function openModal(id) {
      const p = projects.find(item => item.id === id);
      if (!p) return;
      document.getElementById('modalTitle').innerText = currentLang === 'fa' ? p.nameFa : p.nameEn;
      const desc = currentLang === 'fa' ? p.purposeFa : p.purposeEn;
      
      let html = `<p style="color: var(--text-muted); margin-bottom: 20px;">${desc}</p>`;
      html += `<h4 style="margin: 16px 0 8px;">Verified Architecture & Stack</h4><ul>`;
      p.techStack.forEach(t => {
        html += `<li><strong>${t.name}</strong>: ${t.role}</li>`;
      });
      html += `</ul>`;

      if (p.features && p.features.length) {
        html += `<h4 style="margin: 20px 0 8px;">Confirmed Implemented Features</h4><ul>`;
        p.features.forEach(f => {
          html += `<li>${f}</li>`;
        });
        html += `</ul>`;
      }

      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    // Initialize
    renderProjects();
  </script>
</body>
</html>
